name: Update TFT Set 19 site data

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions uses UTC; Sunday 00:00 UTC is Sunday 09:00 JST.
    - cron: "0 0 * * 0"

permissions:
  contents: write

concurrency:
  group: update-tft-set19-site-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh recent PBE statistics and candidates
        run: python scripts/update_tft_stats.py

      - name: Refresh recent YouTube pickups
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/update_sns_pickups.py

      - name: Commit changed site data
        shell: bash
        run: |
          if git diff --quiet -- index.html stats_candidates.json sns_pickups.json; then
            echo "No statistics, candidate, or social pickup changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html stats_candidates.json sns_pickups.json
          git commit -m "Refresh Set 19 stats and YouTube picks"
          git push
