name: Update TFT Set 19 site data

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-tft-set19-site-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh recent PBE statistics
        run: python scripts/update_tft_stats.py

      - name: Commit changed statistics
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No newer values to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refresh Set 19 PBE statistics"
          git push
